:root{--cream:#EDE8DC;--yellow:#E9B949;--ink:#1B1A14;--panel:rgba(16,21,19,.72);--mut:rgba(237,232,220,.7);--red:#E07A6E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0E1311;color:var(--cream);font-family:'Patrick Hand',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#bar{position:fixed;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#151B18;z-index:10;font-size:16px}
#bar button{font:inherit;color:var(--cream);background:rgba(255,255,255,.08);border:0;border-radius:15px;height:30px;padding:0 13px;cursor:pointer}
#bar button.on{background:var(--yellow);color:var(--ink)}
#bar .sp{flex:1}
#wrap{position:fixed;left:0;right:0;top:44px;bottom:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:896px;height:414px;overflow:hidden;transform-origin:center center;background:#2E3F33;flex:none}
canvas{position:absolute;inset:0;width:896px;height:414px;display:block;touch-action:none}
:where(button.hz){font-family:inherit;border:0;padding:0;cursor:pointer;color:var(--cream);background:none}
/* resources */
#res{position:absolute;left:58px;top:12px;display:flex;gap:6px;pointer-events:none}
.chip{height:26px;padding:0 10px 0 7px;border-radius:13px;background:rgba(16,21,19,.55);display:flex;align-items:center;gap:5px;font-size:15px}
#toast{position:absolute;left:50%;top:48px;transform:translateX(-50%);padding:5px 14px;border-radius:14px;background:rgba(16,21,19,.72);font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
/* mobile buttons */
.mb{position:absolute;border-radius:50%;background:rgba(16,21,19,.5);box-shadow:inset 0 0 0 1.5px rgba(237,232,220,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.mb span{font-size:11px;line-height:1}
.mb.big span{font-size:15px}.mb.big{gap:2px}
.mb.on{box-shadow:inset 0 0 0 1.2px rgba(237,232,220,.7)}
.mb.down{background:rgba(16,21,19,.62)}
#hotbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px}
.slot{position:relative;width:44px;height:44px;border-radius:9px;background:rgba(16,21,19,.5);box-shadow:inset 0 0 0 1.5px rgba(237,232,220,.15);display:flex;align-items:center;justify-content:center}
.slot.on{box-shadow:inset 0 0 0 2px var(--yellow)}
.slot b{position:absolute;left:4px;top:2px;font-weight:400;font-size:11px;color:var(--mut)}
#help{position:absolute;right:58px;top:12px;font-size:13px;color:rgba(237,232,220,.6);text-align:right;line-height:1.25;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
/* pc legend */
#legend{position:absolute;right:28px;bottom:22px;display:flex;flex-direction:column;gap:6px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));pointer-events:none}
.lr{display:flex;align-items:center;gap:8px}
.lr .li{width:20px;display:flex;justify-content:center}
.lr .ll{width:56px;font-size:16px;line-height:1;text-shadow:0 2px 5px rgba(0,0,0,.75)}
.kc{min-width:30px;height:26px;padding:0 7px;border-radius:6px;background:rgba(16,21,19,.5);box-shadow:inset 0 0 0 1px rgba(237,232,220,.18);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.lr .kc{width:52px}
.kc.on{background:rgba(16,21,19,.62);box-shadow:inset 0 0 0 1px rgba(237,232,220,.7)}
/* prompt */
#prompt{position:absolute;left:0;right:0;top:244px;display:flex;flex-direction:column;align-items:center;gap:6px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));pointer-events:none}
#prompt .kc{background:rgba(16,21,19,.55)}
#prompt .pt{font-size:17px;letter-spacing:1.5px;text-shadow:0 2px 5px rgba(0,0,0,.75)}
#prompt .ps{font-size:13px;color:var(--mut);margin-top:-4px;text-shadow:0 2px 5px rgba(0,0,0,.75)}
#prompt .ps.bad{color:var(--red)}
/* piece menu */
#pmenu{position:absolute;width:280px;display:flex;flex-direction:column;gap:5px}
#pmenu .ph{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:3px;padding-left:4px}
#pmenu .pn{font-size:15px;letter-spacing:1.5px;color:rgba(237,232,220,.8);text-shadow:0 2px 5px rgba(0,0,0,.75)}
.hp{width:80px;height:3px;border-radius:2px;background:rgba(255,255,255,.2)}.hp i{display:block;height:3px;border-radius:2px;background:var(--cream)}
.pr{display:flex;align-items:center;gap:9px;height:34px;padding:0 12px 0 6px;border-radius:8px;background:rgba(16,21,19,.5);cursor:pointer;width:100%}
.pr:first-of-type{background:rgba(16,21,19,.62)}
.pr .t{font-size:17px;letter-spacing:1.2px;flex-grow:1;white-space:nowrap;text-align:left}
.pr .c{font-size:13px;color:var(--mut);white-space:nowrap}
.pr .c.bad{color:var(--red)}
.pr.off{opacity:.45;cursor:default}
/* build panel */
#dim{position:absolute;inset:0;background:rgba(6,9,8,.42)}
#panel{position:absolute;left:138px;top:14px;width:620px;height:380px;padding:14px;border-radius:14px;background:var(--panel);display:flex;flex-direction:column}
.hd{height:30px;display:flex;align-items:center;gap:6px}
.hd h2{margin:0;font-size:27px;font-weight:400;letter-spacing:1px;flex-grow:1}
.pill{height:30px;padding:0 13px;border-radius:15px;font-size:17px;background:rgba(255,255,255,.07);color:var(--cream);display:flex;align-items:center}
.pill.on{background:var(--yellow);color:var(--ink)}
.cl{width:30px;height:30px;border-radius:15px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;margin-left:4px}
#strip{margin-top:10px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;-webkit-mask-image:linear-gradient(to right,#000 92%,transparent);mask-image:linear-gradient(to right,#000 92%,transparent)}
#strip::-webkit-scrollbar{display:none}
.tile{flex:none;width:74px;height:84px;border-radius:9px;border:2px solid transparent;background:rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tile.on{border-color:var(--yellow);background:rgba(255,255,255,.10)}
.tile .ti{height:48px;display:flex;align-items:center;justify-content:center}
.tile span{font-size:13px;line-height:1.02;text-align:center;padding:0 3px}
.bot{margin-top:10px;flex-grow:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prev{border-radius:11px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 14px}
.prev .pv{height:104px;display:flex;align-items:center;justify-content:center}
.prev .nm{font-size:26px;line-height:1;margin-top:2px}
.prev .ct{font-size:14px;color:var(--mut);margin-top:2px}
.prev .ds{font-size:15px;color:rgba(237,232,220,.85);margin-top:4px;line-height:1.15}
.side{display:flex;flex-direction:column;gap:7px}
.lbl{font-size:15px;color:var(--mut)}
.trow{display:flex;align-items:center;gap:6px}
.trow .lbl{flex-grow:1}
.tp{height:30px;padding:0 15px;border-radius:15px;font-size:17px;background:rgba(255,255,255,.07);color:var(--cream);display:flex;align-items:center}
.tp.on{background:var(--yellow);color:var(--ink)}
.mat{height:42px;border-radius:9px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:8px;padding:0 10px}
.mat .mn{flex-grow:1;display:flex;flex-direction:column;line-height:1.05;text-align:left}
.mat .mn b{font-weight:400;font-size:16px}.mat .mn i{font-style:normal;font-size:13px}
.mat .mc{font-size:18px}
.sel{height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:23px;letter-spacing:1px;background:var(--yellow);color:var(--ink);width:100%}
.sel.off{background:rgba(255,255,255,.08);color:rgba(237,232,220,.6);cursor:default}
.empty{font-size:15px;color:var(--mut);padding:20px}
.hide{display:none!important}
</style>
</head>

  poly([P(0,0,0),P(N*4,0,0),P(N*4,N*4,0),P(0,N*4,0)],'#557A4C');
  ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;
  for(let i=0;i<=N;i++){let a=P(i*4,0,0),b=P(i*4,N*4,0);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();a=P(0,i*4,0);b=P(N*4,i*4,0);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
  // collect boxes for painter sort
  const list=[];
  S.pieces.forEach(p=>{const hl=(S.hammer&&!S.placing&&S.look===p.id)?'rgba(237,232,220,.95)':null;boxesOf(p).forEach(b=>list.push({b,col:p.stone?COL.stone:COL.wood,hl}))});
  if(S.hammer&&S.placing&&S.ghost){const gp={name:S.placing,gx:S.ghost[0],gy:S.ghost[1],rot:S.rot};const ok=afford();boxesOf(gp).forEach(b=>list.push({b,col:ok?COL.ghost:COL.bad,hl:ok?'rgba(233,185,73,.95)':'rgba(224,122,110,.95)',z:1}))}
  TREES.forEach(([tx,ty])=>list.push({tree:[tx*4,ty*4]}));
  const key=o=>{if(o.tree)return o.tree[0]+o.tree[1]+2;const[x,y,z,w,d]=o.b;return x+w/2+y+d/2+z*.6+(o.z?.01:0)};
  list.sort((a,b)=>key(a)-key(b));
  list.forEach(o=>{if(o.tree){const[b,c]=o.tree;const q=P(b,c,0);ctx.fillStyle='#3B2A1C';ctx.fillRect(q[0]-3,q[1]-46,6,46);ctx.fillStyle='#2F5A36';ctx.beginPath();ctx.arc(q[0],q[1]-56,20,0,7);ctx.fill();ctx.fillStyle='#386A40';ctx.beginPath();ctx.arc(q[0]-6,q[1]-62,12,0,7);ctx.fill();return}drawBox(o.b,o.col,o.hl)});
  ctx.fillStyle='rgba(237,232,220,.9)';ctx.beginPath();ctx.arc(CX,CY,2.5,0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.stroke();
}

/* ---------- helpers ---------- */
const matOf=(name,stone)=>IT[name].struct?(stone?'Stone':'Planks'):'Planks';
const costOf=(name,stone)=>IT[name].cost+(stone&&IT[name].struct?1:0);
const fullName=(name,stone)=>IT[name].struct?((stone?'Stone ':'Wooden ')+(name==='Wooden Platform'?'Platform':name)):name;
function afford(){return S.inv[matOf(S.placing,S.placeStone)]>=costOf(S.placing,S.placeStone)}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1600)}
const maxHp=p=>p.stone?200:100;

/* ---------- UI render ---------- */
function renderRes(){$('#res').innerHTML=`<div class="chip">${I.planksS}${S.inv.Planks}</div><div class="chip">${I.stoneS}${S.inv.Stone}</div>`}
function renderHud(){
  const mob=S.mode==='mobile';
  const buildOn=S.menu||!!S.placing;const H=S.hammer;
  $('#mobile').classList.toggle('hide',!mob||S.menu);$('#legend').classList.toggle('hide',mob||S.menu);
  if(mob){
    $('#mobile').innerHTML=`
    <button class="hz mb ${S.sprint?'on':''}" data-a="sprint" style="left:692px;top:278px;width:48px;height:48px">${I.sprint}<span>Sprint</span></button>
    <button class="hz mb ${S.crouch?'on':''}" data-a="crouch" style="left:676px;top:352px;width:48px;height:48px">${I.crouch}<span>Crouch</span></button>
    <button class="hz mb big ${S.jump?'down':''}" data-a="jump" style="left:752.5px;top:324px;width:70px;height:70px">${I.jump}<span>Jump</span></button>
    ${H?`<button class="hz mb ${buildOn?'on':''}" data-a="build" style="left:790px;top:204px;width:48px;height:48px">${I.build}<span>Build</span></button>`:''}
    ${H&&S.placing?`<button class="hz mb" data-a="rotate" style="left:790px;top:146px;width:48px;height:48px">${I.rotate}<span>Rotate</span></button>`:''}`;
  }else{
    const r=(ic,l,k,on)=>`<div class="lr"><span class="li">${ic}</span><span class="ll">${l}</span><span class="kc ${on?'on':''}">${k}</span></div>`;
    $('#legend').innerHTML=(H&&S.placing?r(I.rotate19,'Rotate','R'):'')+(H?r(I.build19,'Build','B',buildOn):'')+r(I.sprintS,'Sprint','Shift',S.sprint)+r(I.crouchS,'Crouch','C',S.crouch)+r(I.jumpS,'Jump','Space',S.jump);
  }
  // prompt
  const pr=$('#prompt');
  $('#hotbar').innerHTML=[['hammer','Hammer'],['axe','Axe'],['spear','Spear']].map((x,i)=>`<button class="hz slot ${(i===0&&S.hammer)?'on':''}" data-slot="${i}">${I[x[0]]}${mob?'':`<b>${i+1}</b>`}</button>`).join('');
  if(H&&S.placing&&!S.menu){
    const m=matOf(S.placing,S.placeStone),c=costOf(S.placing,S.placeStone),ok=S.inv[m]>=c;
    pr.innerHTML=`<div class="kc">${mob?'TAP':I.mouse}</div><div class="pt">PLACE ${fullName(S.placing,S.placeStone).toUpperCase()}</div><div class="ps ${ok?'':'bad'}">${ok?c+' '+m:'Need '+(c-S.inv[m])+' more '+m}</div>`;
    pr.classList.remove('hide');
  }else pr.classList.add('hide');
  renderPMenu();
}
function renderPMenu(){
  const el=$('#pmenu');const p=S.pieces.find(q=>q.id===S.look);
  if(!p||!S.hammer||S.placing||S.menu){el.classList.add('hide');return}
  const mob=S.mode==='mobile';const st=IT[p.name].struct;const mh=maxHp(p);
  const upC=costOf(p.name,true),repM=p.stone?'Stone':'Planks',repC=2,refund=Math.floor(costOf(p.name,p.stone)/2)||1;
  const rows=[];
  if(st&&!p.stone){const ok=S.inv.Stone>=upC;rows.push(`<button class="hz pr" data-p="up"><span class="kc">${mob?I.up:'E'}</span><span class="t">UPGRADE TO STONE</span><span class="c ${ok?'':'bad'}">${upC} Stone</span></button>`)}
  const full=p.hp>=mh;const rok=S.inv[repM]>=repC;
  rows.push(`<button class="hz pr ${full?'off':''}" data-p="repair"><span class="kc">${mob?I.repair:'R'}</span><span class="t">REPAIR</span><span class="c ${!full&&!rok?'bad':''}">${full?'Full':repC+' '+repM}</span></button>`);
  rows.push(`<button class="hz pr" data-p="destroy"><span class="kc">${mob?I.destroy:'X'}</span><span class="t">DESTROY</span><span class="c">+${refund} ${repM}</span></button>`);
  el.innerHTML=`<div class="ph"><div class="pn">${fullName(p.name,p.stone).toUpperCase()}</div><div class="hp"><i style="width:${Math.round(p.hp/mh*100)}%"></i></div><div style="font-size:12px;color:var(--mut);margin-top:-2px">${p.hp} / ${mh}</div></div>${rows.join('')}`;
  el.style.left=(CX-306)+'px';el.style.top=(CY-44)+'px';el.classList.remove('hide');
}
function renderMenu(){renderHudVis();
  $('#menu').classList.toggle('hide',!S.menu);if(!S.menu)return;
  const list=D.tabs[S.tab];if(!list.includes(S.sel))S.sel=list[0];
  const it=IT[S.sel];const stone=it.struct&&S.stone;
  const m=matOf(S.sel,stone),c=costOf(S.sel,stone),have=S.inv[m],ok=have>=c;
  $('#panel').innerHTML=`
  <div class="hd"><h2>Build</h2>${TABS.map(t=>`<button class="hz pill ${t===S.tab?'on':''}" data-tab="${t}">${t}</button>`).join('')}<button class="hz cl" data-a="close">${I.x}</button></div>
  <div id="strip">${list.map(n=>`<button class="hz tile ${n===S.sel?'on':''}" data-sel="${n}"><span class="ti">${stone&&IT[n].struct?IT[n].ss:IT[n].sw}</span><span>${n}</span></button>`).join('')}</div>
  <div class="bot">
    <div class="prev"><div class="pv">${stone?it.bs:it.bw}</div><div class="nm">${fullName(S.sel,stone)}</div><div class="ct">${S.tab}</div>${it.desc?`<div class="ds">${stone&&S.sel==='Wall'?'Stacked stone blocks. Much harder to break than wood.':it.desc}</div>`:''}</div>
    <div class="side">
      ${it.struct?`<div class="trow"><span class="lbl">Type</span><button class="hz tp ${!S.stone?'on':''}" data-type="wood">Wood</button><button class="hz tp ${S.stone?'on':''}" data-type="stone">Stone</button></div>`:''}
      <div class="lbl" style="margin-top:2px">Required materials</div>
      <div class="mat">${m==='Stone'?I.stone:I.planks}<div class="mn"><b>${m}</b><i style="color:${ok?'var(--yellow)':'var(--red)'}">${ok?'Ready':'Need '+(c-have)+' more'}</i></div><span class="mc">${have} / ${c}</span></div>
      <div style="flex-grow:1"></div>
      <button class="hz sel ${ok?'':'off'}" data-a="select">${ok?'Select':'Missing materials'}</button>
    </div>
  </div>`;
  const s=$('#strip'),on=s.querySelector('.tile.on');if(on&&S._scrollTo){const x=on.offsetLeft-s.offsetLeft;if(x+74>s.clientWidth)s.scrollLeft=x-s.clientWidth+74+40;S._scrollTo=false}
}
function renderHudVis(){const mob=S.mode==='mobile';$('#mobile').classList.toggle('hide',!mob||S.menu);$('#legend').classList.toggle('hide',mob||S.menu)}
function render(){$('#help').innerHTML=S.mode==='mobile'?'Drag to look around<br>Tap to place':'WASD or drag to look<br>1 = hammer';renderRes();renderHud();renderMenu();draw()}

/* ---------- actions ---------- */
function openMenu(){if(!S.hammer)return;S.menu=true;S.placing=null;S._scrollTo=true;render()}
function closeMenu(){S.menu=false;render()}
function toggleBuild(){if(!S.hammer)return;if(S.menu)closeMenu();else if(S.placing){S.placing=null;render()}else openMenu()}
function selectPiece(){const it=IT[S.sel];const stone=it.struct&&S.stone;if(S.inv[matOf(S.sel,stone)]<costOf(S.sel,stone))return;S.placing=S.sel;S.placeStone=stone;S.menu=false;S.rot=0;aim();render()}
function rotate(){if(!S.placing)return;S.rot=(S.rot+1)%4;render()}
function place(){
  if(!S.placing||!S.ghost)return;const m=matOf(S.placing,S.placeStone),c=costOf(S.placing,S.placeStone);
  if(S.inv[m]<c){toast('Not enough '+m);return}
  S.inv[m]-=c;S.pieces.push({id:S.nextId++,name:S.placing,stone:S.placeStone,gx:S.ghost[0],gy:S.ghost[1],rot:S.rot,hp:S.placeStone?200:100});render();
}
function pieceAction(a){
  if(!S.hammer||S.placing||S.menu)return;const p=S.pieces.find(q=>q.id===S.look);if(!p)return;
  if(a==='up'){if(!IT[p.name].struct||p.stone)return;const c=costOf(p.name,true);if(S.inv.Stone<c){toast('Not enough Stone');return}S.inv.Stone-=c;p.stone=true;p.hp=200;toast('Upgraded to stone')}
  if(a==='repair'){const mh=maxHp(p),m=p.stone?'Stone':'Planks';if(p.hp>=mh)return;if(S.inv[m]<2){toast('Not enough '+m);return}S.inv[m]-=2;p.hp=mh;toast('Repaired')}
  if(a==='destroy'){const m=p.stone?'Stone':'Planks';S.inv[m]+=Math.floor(costOf(p.name,p.stone)/2)||1;S.pieces=S.pieces.filter(q=>q!==p);aim()}
  render();
}

/* ---------- input ---------- */
function toLocal(e){const r=stage.getBoundingClientRect();return[(e.clientX-r.left)/S.k,(e.clientY-r.top)/S.k]}
function cellAt(sx,sy){const a=(sx-OX)/(0.866*SC),b=(sy-OY)/(0.5*SC);const x=(a+b)/2,y=(b-a)/2;const gx=Math.floor(x/4),gy=Math.floor(y/4);if(gx<0||gy<0||gx>=N||gy>=N)return null;return[gx,gy]}
function pieceAt(sx,sy){
  // top-most piece whose projected faces contain point
  let best=null,bk=-1e9;
  S.pieces.forEach(p=>boxesOf(p).forEach(([x,y,z,w,d,h])=>{
    const faces=[[P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],[P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],[P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)]];
    for(const f of faces){if(inPoly(sx,sy,f)){const k=x+w/2+y+d/2+z*.6;if(k>bk){bk=k;best=p}}}
  }));return best;
}
function inPoly(x,y,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
function aim(){S.ghost=cellAt(CX,CY);const p=pieceAt(CX,CY);S.look=p?p.id:null}
function aimRender(){const g=S.ghost?S.ghost.join():'',l=S.look;aim();if((S.ghost?S.ghost.join():'')!==g||S.look!==l)renderHud();draw()}
function setHammer(on){S.hammer=on;if(!on){S.placing=null;S.menu=false}aim();render()}
function pan(dx,dy){S.camX=Math.max(-330,Math.min(330,S.camX+dx));S.camY=Math.max(-200,Math.min(190,S.camY+dy));aimRender()}
let drag=null;
cv.addEventListener('pointerdown',e=>{if(S.menu)return;cv.setPointerCapture(e.pointerId);const[x,y]=toLocal(e);drag={x,y,sx:x,sy:y,moved:false}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const[x,y]=toLocal(e);const dx=x-drag.x,dy=y-drag.y;drag.x=x;drag.y=y;if(Math.abs(x-drag.sx)+Math.abs(y-drag.sy)>6)drag.moved=true;pan(dx,dy)});
cv.addEventListener('pointerup',e=>{if(!drag)return;const tap=!drag.moved;drag=null;if(tap&&S.hammer&&S.placing)place()});
stage.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const a=b.dataset.a;
  if(a==='build')toggleBuild();else if(a==='rotate')rotate();else if(a==='close')closeMenu();else if(a==='select')selectPiece();
  else if(a==='sprint'){S.sprint=!S.sprint;renderHud()}else if(a==='crouch'){S.crouch=!S.crouch;renderHud()}
  else if(a==='jump'){S.jump=true;renderHud();setTimeout(()=>{S.jump=false;renderHud()},150)}
  else if(b.dataset.tab){S.tab=b.dataset.tab;S.sel=D.tabs[S.tab][0];render()}
  else if(b.dataset.sel){S.sel=b.dataset.sel;renderMenu()}
  else if(b.dataset.type){S.stone=b.dataset.type==='stone';renderMenu()}
  else if(b.dataset.p){if(!b.classList.contains('off'))pieceAction(b.dataset.p)}
  else if(b.dataset.slot){const i=+b.dataset.slot;if(i===0)setHammer(!S.hammer);else{setHammer(false);toast(['','Axe','Spear'][i]+' equipped')}}
});
$('#dim').addEventListener('click',closeMenu);
addEventListener('keydown',e=>{
  if(S.mode!=='pc')return;const k=e.key.toLowerCase();
  if(k==='1')setHammer(!S.hammer);else if(k==='2'||k==='3'){setHammer(false)}
  else if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){const m={w:[0,14],arrowup:[0,14],s:[0,-14],arrowdown:[0,-14],a:[14,0],arrowleft:[14,0],d:[-14,0],arrowright:[-14,0]}[k];pan(m[0],m[1])}
  else if(k==='b')toggleBuild();
  else if(k==='escape'){if(S.menu)closeMenu();else if(S.placing){S.placing=null;render()}}
  else if(k==='r'){if(S.placing)rotate();else pieceAction('repair')}
  else if(k==='e')pieceAction('up');
  else if(k==='x')pieceAction('destroy');
  else if(k==='shift'){S.sprint=!S.sprint;renderHud()}
  else if(k==='c'){S.crouch=!S.crouch;renderHud()}
  else if(k===' '){e.preventDefault();S.jump=true;renderHud();setTimeout(()=>{S.jump=false;renderHud()},150)}
});
function setMode(m){S.mode=m;$('#mMob').classList.toggle('on',m==='mobile');$('#mPc').classList.toggle('on',m==='pc');render()}
$('#mMob').onclick=()=>setMode('mobile');$('#mPc').onclick=()=>setMode('pc');
$('#addP').onclick=()=>{S.inv.Planks+=10;render()};$('#addS').onclick=()=>{S.inv.Stone+=10;render()};
$('#reset').onclick=()=>{const m=S.mode;S=fresh();S.mode=m;fit();aim();render()};
fit();aim();render();
</script>
</body>
