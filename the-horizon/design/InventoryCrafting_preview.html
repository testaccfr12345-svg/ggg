<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Horizon — Inventory, Crafting &amp; Hotbar (preview)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<style>
html,body{margin:0;height:100%;background:#0d1110;overflow:hidden}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#root{width:1280px;height:720px;position:relative;overflow:hidden;flex:none;transform-origin:center center;font-family:'Patrick Hand','Comic Sans MS',sans-serif;color:#EDE8DC;background:#2E3F3A}

body{margin:0}
a{color:#EDE8DC}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
.hz-row::-webkit-scrollbar{height:6px}
.hz-row::-webkit-scrollbar-thumb{background:rgba(237,232,220,0.25);border-radius:3px}
@keyframes hzOpen{from{opacity:0;transform:scale(0.98)}to{opacity:1;transform:scale(1)}}
@keyframes hzFade{from{opacity:0}to{opacity:1}}
@keyframes hzIn{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes hzFlash{0%{box-shadow:0 0 0 0 currentColor}100%{box-shadow:0 0 0 10px transparent}}
@keyframes hzPIn{from{transform:translateX(21px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes hzPOut{from{transform:translateX(0);opacity:1}to{transform:translateX(21px);opacity:0}}
@keyframes hzTick{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.hz-in{animation:hzIn 0.28s ease-out}
.hz-flash-a,.hz-flash-b{animation:hzFlash 0.7s ease-out 2}
.hz-pin{animation:hzPIn 0.28s cubic-bezier(0.25,1,0.5,1)}
.hz-pout{animation:hzPOut 0.28s cubic-bezier(0.5,0,0.75,0) forwards}
.hz-tick-a,.hz-tick-b{animation:hzTick 0.3s ease-out}
@media (prefers-reduced-motion: reduce){.hz-in,.hz-flash-a,.hz-flash-b,.hz-pin,.hz-pout,.hz-tick-a,.hz-tick-b{animation:none}}

@keyframes hzOpen{from{transform:scale(0.94)}to{transform:scale(1)}}
@keyframes hzFromLeft{from{transform:translateX(-28px)}to{transform:translateX(0)}}
@keyframes hzFromRight{from{transform:translateX(28px)}to{transform:translateX(0)}}
#note{position:fixed;left:8px;bottom:6px;font:12px system-ui,sans-serif;color:#7c8682}
</style>
</head>

var HZ_RECIPES = {
  tools: [
    { id: 'stone_pickaxe', mats: [['planks', 4], ['stone', 4], ['rope', 2]] },
    { id: 'stone_axe', mats: [['planks', 3], ['stone', 4], ['rope', 2]] },
    { id: 'stone_spear', mats: [['planks', 3], ['stone', 1], ['rope', 1]] },
    { id: 'wooden_club', mats: [['planks', 3], ['rope', 1]] },
    { id: 'stone_sword', mats: [['planks', 3], ['stone', 5], ['rope', 2]] },
    { id: 'torch', mats: [['planks', 1], ['leaves', 4], ['rope', 1]] },
    { id: 'wooden_shield', mats: [['planks', 6], ['rope', 2], ['hide', 1]] },
    { id: 'map', mats: [['hide', 2], ['fiber', 2]] },
    { id: 'compass', mats: [['scrap', 3], ['plastic', 1]] }
  ],
  resources: [
    { id: 'rope', mats: [['leaves', 3]] },
    { id: 'nails', mats: [['scrap', 1]] }
  ],
  consumables: [
    { id: 'cup_clean', mats: null }
  ]
};
// Placeholder craft times in seconds — change these to whatever the real game uses.
var HZ_TIMES = { stone_pickaxe: 4, stone_axe: 4, stone_spear: 3, wooden_club: 2.5, stone_sword: 5, torch: 2, wooden_shield: 4, map: 3, compass: 3, rope: 1.5, nails: 1 };
var HZ_QMAX = 8;
var HZ_CAT_NAMES = { tools: 'Tools', resources: 'Resources', consumables: 'Consumables' };

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      open: true,
      cat: 'tools',
      sel: 'stone_pickaxe',
      inv: { planks: 12, stone: 9, leaves: 14, rope: 3, fiber: 6, scrap: 2, hide: 3, cup_clean: 1 },
      invSel: null,
      hot: ['stone_axe', 'torch', 'cup_sea', null, null, null, null, null],
      hotSel: 0,
      queue: [],
      elapsed: 0,
      started: false,
      finish: null,
      leaving: false,
      flashId: null,
      flashTick: 0
    };
    this.uid = 0;
    this.timers = [];
    this.finishTimers = [];
    this.ticker = null;
  }
  componentDidMount() {
    var self = this;
    this.ticker = setInterval(function () { self.onTick(); }, 100);
  }
  componentWillUnmount() {
    if (this.ticker) clearInterval(this.ticker);
    this.timers.concat(this.finishTimers).forEach(function (t) { clearTimeout(t); });
  }
  later(fn, ms) {
    this.timers.push(setTimeout(fn, ms));
  }
  reserved() {
    // materials still needed for queued items that have not started yet
    var s = this.state;
    var need = {};
    s.queue.forEach(function (j, i) {
      var units = j.count - (i === 0 && s.started ? 1 : 0);
      j.mats.forEach(function (m) { need[m[0]] = (need[m[0]] || 0) + m[1] * units; });
    });
    return need;
  }
  available(id) {
    return (this.state.inv[id] || 0) - (this.reserved()[id] || 0);
  }
  maxCraftable(r) {
    var self = this;
    if (!r.mats) return 0;
    var n = Infinity;
    r.mats.forEach(function (m) { n = Math.min(n, Math.floor(self.available(m[0]) / m[1])); });
    return Math.max(0, n === Infinity ? 0 : n);
  }
  canCraft(r) {
    return this.maxCraftable(r) > 0;
  }
  canQueue(r) {
    var q = this.state.queue;
    var last = q[q.length - 1];
    return !!(last && last.id === r.id) || q.length < HZ_QMAX;
  }
  current() {
    var s = this.state;
    var list = HZ_RECIPES[s.cat];
    return list.find(function (r) { return r.id === s.sel; }) || list[0];
  }
  addToQueue(n) {
    var s = this.state;
    var r = this.current();
    if (n < 1 || !this.canQueue(r)) return;
    var queue = s.queue.slice();
    var last = queue[queue.length - 1];
    if (last && last.id === r.id) {
      queue[queue.length - 1] = Object.assign({}, last, { count: last.count + n, total: last.total + n });
    } else {
      queue.push({ uid: ++this.uid, id: r.id, dur: HZ_TIMES[r.id] || 3, mats: r.mats, count: n, total: n });
    }
    this.finishTimers.forEach(function (t) { clearTimeout(t); });
    this.finishTimers = [];
    this.setState({ queue: queue, invSel: null, finish: null, leaving: false });
  }
  craft() {
    if (this.canCraft(this.current())) this.addToQueue(1);
  }
  craftAll() {
    this.addToQueue(this.maxCraftable(this.current()));
  }
  clearQueue() {
    // clears everything except the item currently being made
    var s = this.state;
    if (!s.queue.length) return;
    if (s.started) this.setState({ queue: [Object.assign({}, s.queue[0], { count: 1, total: s.queue[0].total - s.queue[0].count + 1 })] });
    else this.setState({ queue: [], elapsed: 0 });
  }
  onTick() {
    var s = this.state;
    if (!s.queue.length) return;
    var job = s.queue[0];
    var inv = Object.assign({}, s.inv);
    if (!s.started) {
      // materials are taken when each item starts
      var ok = job.mats.every(function (m) { return (inv[m[0]] || 0) >= m[1]; });
      if (!ok) {
        this.setState({ queue: s.queue.slice(1), elapsed: 0, started: false });
        return;
      }
      job.mats.forEach(function (m) { inv[m[0]] = inv[m[0]] - m[1]; });
      this.setState({ inv: inv, started: true, elapsed: 0 });
      return;
    }
    var e = s.elapsed + 0.1;
    if (e < job.dur - 0.0001) {
      this.setState({ elapsed: e });
      return;
    }
    var self = this;
    inv[job.id] = (inv[job.id] || 0) + 1;
    var queue = s.queue.slice();
    if (job.count > 1) queue[0] = Object.assign({}, job, { count: job.count - 1 }); else queue.shift();
    var finish = null;
    if (!queue.length) {
      // hold for 0.65s, then slide out (same timing as the old CraftingProgress)
      finish = { id: job.id, total: job.total };
      this.finishTimers = [
        setTimeout(function () { self.setState({ leaving: true }); }, 650),
        setTimeout(function () { self.setState({ finish: null, leaving: false }); }, 930)
      ];
    }
    var tick = s.flashTick + 1;
    this.setState({ inv: inv, queue: queue, elapsed: 0, started: false, flashId: job.id, flashTick: tick, finish: finish || s.finish });
    this.later(function () {
      if (self.state.flashTick === tick) self.setState({ flashId: null });
    }, 1500);
  }
  renderVals() {
    var s = this.state;
    var self = this;
    var accent = this.props.accent || '#E9B949';
    var accent2 = accent;
    var alpha = this.props.panelAlpha != null ? this.props.panelAlpha : 0.68;
    var panelBg = 'rgba(16, 21, 19, ' + alpha + ')';
    var hx = String(accent2).replace('#', '');
    var hn = parseInt(hx.length === 3 ? hx[0] + hx[0] + hx[1] + hx[1] + hx[2] + hx[2] : hx.slice(0, 6), 16);
    if (isNaN(hn)) hn = 0xE9B949;
    var accent2Soft = 'rgba(' + ((hn >> 16) & 255) + ', ' + ((hn >> 8) & 255) + ', ' + (hn & 255) + ', 0.35)';

    var queuedById = {};
    s.queue.forEach(function (j) { queuedById[j.id] = (queuedById[j.id] || 0) + j.count; });

    var cats = ['tools', 'resources', 'consumables'].map(function (id) {
      var on = s.cat === id;
      return {
        label: HZ_CAT_NAMES[id],
        bg: on ? accent : 'rgba(255, 255, 255, 0.07)',
        fg: on ? '#1B1A14' : '#EDE8DC',
        pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ cat: id, sel: HZ_RECIPES[id][0].id }); }
      };
    });

    var cur = this.current();
    var recipes = HZ_RECIPES[s.cat].map(function (r) {
      var on = r.id === cur.id;
      var n = queuedById[r.id] || 0;
      return {
        name: HZ_ITEMS[r.id].name,
        icon: HZ_ITEMS[r.id].icon,
        border: on ? accent : 'transparent',
        bg: on ? 'rgba(255, 255, 255, 0.12)' : 'rgba(255, 255, 255, 0.05)',
        iconOpacity: self.canCraft(r) || n ? '1' : '0.45',
        queued: n > 0,
        queuedText: 'x' + n,
        pick: function () { self.setState({ sel: r.id }); }
      };
    });

    var mats = (cur.mats || []).map(function (m) {
      var have = Math.max(0, self.available(m[0]));
      var ok = have >= m[1];
      return {
        name: HZ_ITEMS[m[0]].name,
        icon: HZ_ITEMS[m[0]].icon,
        have: String(have),
        need: String(m[1]),
        color: ok ? '#EDE8DC' : '#F4A47C',
        statusColor: ok ? accent2 : '#F4A47C',
        status: ok ? 'Ready' : 'Need ' + (m[1] - have) + ' more'
      };
    });
    var can = this.canCraft(cur);
    var full = !this.canQueue(cur);
    var maxN = this.maxCraftable(cur);

    var keys = Object.keys(s.inv).filter(function (k) { return s.inv[k] > 0; });
    var flashCls = s.flashTick % 2 ? 'hz-flash-a' : 'hz-flash-b';
    var slots = [];
    for (var i = 0; i < 30; i++) {
      (function (idx) {
        var k = keys[idx];
        var on = s.invSel === idx && !!k;
        slots.push({
          has: !!k,
          icon: k ? HZ_ITEMS[k].icon : '',
          count: k && s.inv[k] > 1 ? String(s.inv[k]) : '',
          label: k ? HZ_ITEMS[k].name + ', ' + s.inv[k] : 'Empty slot',
          border: on ? accent : 'transparent',
          cls: k && k === s.flashId ? flashCls : '',
          pick: function () { self.setState({ invSel: idx }); }
        });
      })(i);
    }
    var selKey = s.invSel != null ? keys[s.invSel] : null;

    var hot = s.hot.map(function (id, idx) {
      var on = s.hotSel === idx;
      return {
        num: String(idx + 1),
        has: !!id,
        icon: id ? HZ_ITEMS[id].icon : '',
        label: 'Hotbar slot ' + (idx + 1) + (id ? ', ' + HZ_ITEMS[id].name : ', empty'),
        pressed: on ? 'true' : 'false',
        border: on ? accent : 'rgba(255, 255, 255, 0.10)',
        bg: on ? 'rgba(255, 255, 255, 0.16)' : 'rgba(255, 255, 255, 0.06)',
        pick: function () { self.setState({ hotSel: idx }); }
      };
    });
    var hotId = s.hot[s.hotSel];

    var job = s.queue[0];
    var qCount = queuedById[cur.id] || 0;
    var unit = job ? (s.started ? Math.min(1, s.elapsed / job.dur) : 0) : 1;

    return {
      accent: accent,
      accent2: accent2,
      accent2Soft: accent2Soft,
      panelBg: panelBg,
      open: s.open,
      closed: !s.open,
      openInv: function () { self.setState({ open: true }); },
      closeInv: function () { self.setState({ open: false }); },
      usedSlots: String(keys.length),
      invInfo: selKey ? HZ_ITEMS[selKey].name + '  x' + s.inv[selKey] : 'Click an item',
      slots: slots,
      cats: cats,
      recipes: recipes,
      curIcon: HZ_ITEMS[cur.id].icon,
      curName: HZ_ITEMS[cur.id].name,
      curCat: HZ_CAT_NAMES[s.cat] + (HZ_TIMES[cur.id] ? '  ·  ' + HZ_TIMES[cur.id] + 's to craft' : ''),
      curDesc: HZ_ITEMS[cur.id].desc || '',
      hasRecipe: !!cur.mats,
      noRecipe: !cur.mats,
      mats: mats,
      queuedLine: qCount ? qCount + ' in queue' : '',
      canClear: s.queue.length > 1 || (s.queue.length === 1 && (s.queue[0].count > 1 || !s.started)),
      clearQueue: function () { self.clearQueue(); },
      craft: function () { self.craft(); },
      craftAll: function () { self.craftAll(); },
      craftDisabled: !can || full,
      craftLabel: full ? 'Queue full' : (can ? 'Craft' : (cur.mats ? 'Missing materials' : 'Recipe not set')),
      craftBg: can && !full ? accent : 'rgba(255, 255, 255, 0.08)',
      craftFg: can && !full ? '#1B1A14' : 'rgba(237, 232, 220, 0.6)',
      allLabel: maxN > 1 ? 'All (' + maxN + ')' : 'All',
      allBorder: can && !full ? accent : 'rgba(255, 255, 255, 0.12)',
      allFg: can && !full ? accent : 'rgba(237, 232, 220, 0.5)',
      hot: hot,
      hotName: hotId ? HZ_ITEMS[hotId].name : 'Empty hand',
      showProg: s.queue.length > 0 || !!s.finish,
      pCls: s.leaving ? 'hz-pout' : 'hz-pin',
      pTitle: job ? 'Crafting ' + HZ_ITEMS[job.id].name : (s.finish ? 'Crafted ' + HZ_ITEMS[s.finish.id].name : ''),
      pDesc: job ? (Math.max(0, job.dur * job.count - (s.started ? s.elapsed : 0)).toFixed(1) + 's left' + (s.queue.length > 1 ? '  ·  ' + (s.queue.length - 1) + ' more queued' : '')) : 'Done',
      pSub: job ? (s.queue.length > 1 ? 'Crafting  ·  next: ' + HZ_ITEMS[s.queue[1].id].name + ' x' + s.queue[1].count : 'Crafting...') : 'Added to inventory',
      pAmount: job ? 'x' + job.count : (s.finish ? 'x' + s.finish.total : ''),
      pTime: job ? Math.max(0, job.dur * job.count - (s.started ? s.elapsed : 0)).toFixed(1) + 's' : 'Done',
      pIcon: job ? HZ_ITEMS[job.id].icon : (s.finish ? HZ_ITEMS[s.finish.id].icon : ''),
      pDone: !job && !!s.finish,
      pRingOff: String((100.53 * (1 - unit)).toFixed(2)),
      pTickCls: s.flashId ? (s.flashTick % 2 ? 'hz-tick-a' : 'hz-tick-b') : '',
      pAria: job ? 'Crafting ' + job.count + ' ' + HZ_ITEMS[job.id].name : (s.finish ? 'Crafted ' + s.finish.total + ' ' + HZ_ITEMS[s.finish.id].name : ''),
      pPct: String((unit * 100).toFixed(1)),
      pTrans: unit < 0.08 ? 'none' : 'width 0.1s linear',
    };
  }
}

      </div>
      <div style="margin-top:12px;font-size:17px;color:rgba(237,232,220,0.7)">Equipment</div>
      <div style="margin-top:6px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:352px">${equip}
      </div>
      <div style="margin-top:14px;display:flex;justify-content:space-between;font-size:17px">
        <span style="color:rgba(237,232,220,0.7)">Backpack</span>
        <span style="color:#EDE8DC">${esc(v.invInfo)}</span>
      </div>
      <div style="margin-top:6px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px">${slots}
      </div>
    </section>
    <section aria-label="Crafting" style="width:640px;height:560px;box-sizing:border-box;padding:20px;border-radius:14px;background:${v.panelBg};display:flex;flex-direction:column;animation:hzFromRight 0.16s cubic-bezier(0.25,1,0.5,1)">
      <div style="height:36px;display:flex;align-items:center;gap:8px">
        <h2 style="margin:0;font-size:30px;font-weight:400;letter-spacing:1px;flex-grow:1">Crafting</h2>${cats}
        <button type="button" aria-label="Close inventory" data-h="${H(v.closeInv)}" style="width:36px;height:36px;margin-left:6px;border-radius:18px;border:none;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;padding:0">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M3 3 L13 13 M13 3 L3 13" stroke="#EDE8DC" stroke-width="2" stroke-linecap="round"></path></svg>
        </button>
      </div>
      <div class="hz-row" style="margin-top:16px;height:112px;display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;box-sizing:border-box">${recipes}
      </div>
      <div style="margin-top:14px;flex-grow:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px">
        <div style="border-radius:12px;background:rgba(255,255,255,0.05);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px;text-align:center">
          <img src="${v.curIcon}" alt="" style="width:156px;height:156px">
          <div style="margin-top:8px;font-size:32px;line-height:1">${esc(v.curName)}</div>
          <div style="font-size:16px;color:rgba(237,232,220,0.7)">${esc(v.curCat)}</div>
          <div style="margin-top:6px;font-size:18px;color:rgba(237,232,220,0.85);max-width:240px">${esc(v.curDesc)}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="font-size:17px;color:rgba(237,232,220,0.7)">Required materials</div>${mats}
          <div style="flex-grow:1"></div>
          <div style="height:26px;display:flex;align-items:center;justify-content:space-between;gap:8px">
            <span style="font-size:17px;color:rgba(237,232,220,0.7)">${esc(v.queuedLine)}</span>
            ${v.canClear ? `<button type="button" data-h="${H(v.clearQueue)}" style="height:26px;padding:0 10px;border-radius:13px;border:none;background:rgba(255,255,255,0.08);color:#EDE8DC;font-size:15px">Clear queue</button>` : ''}
          </div>
          <div style="display:flex;gap:8px">
            <button type="button" data-h="${H(v.craft)}" ${v.craftDisabled ? 'disabled' : ''} style="flex-grow:1;height:52px;border-radius:12px;border:none;font-size:26px;letter-spacing:1px;background:${v.craftBg};color:${v.craftFg}">${esc(v.craftLabel)}</button>
            <button type="button" data-h="${H(v.craftAll)}" ${v.craftDisabled ? 'disabled' : ''} style="flex:none;width:104px;height:52px;box-sizing:border-box;border-radius:12px;border:2px solid ${v.allBorder};background:transparent;font-size:20px;color:${v.allFg}">${esc(v.allLabel)}</button>
          </div>
        </div>
      </div>
    </section>
  </div>` : '';

  const hot = v.hot.map(h => `
      <button type="button" aria-label="${esc(h.label)}" aria-pressed="${h.pressed}" data-h="${H(h.pick)}" style="position:relative;width:64px;height:64px;border-radius:8px;border:2px solid ${h.border};background:${h.bg};display:flex;align-items:center;justify-content:center;padding:0;color:#EDE8DC">
        <span style="position:absolute;left:6px;top:1px;font-size:15px;color:rgba(237,232,220,0.75)">${esc(h.num)}</span>
        ${h.has ? `<img src="${h.icon}" alt="" style="width:40px;height:40px">` : ''}
      </button>`).join('');

  return `
  <svg aria-hidden="true" width="1280" height="720" viewBox="0 0 1280 720" style="position:absolute;left:0;top:0">
    <rect x="0" y="0" width="1280" height="430" fill="#2E3F3A"></rect>
    <rect x="0" y="430" width="1280" height="290" fill="#1F2E2D"></rect>
    <path d="M0 432 C90 392 170 372 260 398 C320 414 360 430 420 432 Z" fill="#1A2522"></path>
    <path d="M520 432 C600 360 700 330 790 372 C840 396 880 420 960 432 Z" fill="#18221F"></path>
    <path d="M1040 432 C1100 404 1170 396 1280 412 L1280 432 Z" fill="#1A2522"></path>
    <path d="M660 340 L690 300 L712 330 L730 312 L760 352" fill="none" stroke="#18221F" stroke-width="6"></path>
  </svg>${closedHud}${menu}${prog}
  <div id="hotbargroup" style="position:absolute;left:304px;bottom:14px;width:672px;height:80px;display:flex;gap:8px">
    <div aria-label="Hotbar" style="width:584px;box-sizing:border-box;padding:8px;border-radius:12px;background:${v.panelBg};display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px">${hot}
    </div>
    <button type="button" aria-label="Inventory (Tab)" data-h="${H(v.toggleInv)}" style="position:relative;width:80px;height:80px;border-radius:12px;border:2px solid ${v.open ? v.accent : 'transparent'};background:${v.panelBg};display:flex;align-items:center;justify-content:center;padding:0;color:#EDE8DC">
      <span style="position:absolute;left:7px;top:2px;font-size:13px;color:rgba(237,232,220,0.65)">TAB</span>
      <svg aria-hidden="true" width="34" height="34" viewBox="0 0 28 28" fill="none" stroke="#EDE8DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 9 V7.5 a4 4 0 0 1 8 0 V9"></path><rect x="5" y="9" width="18" height="15" rx="4.5"></rect><path d="M9 16.5 H19"></path></svg>
    </button>
  </div>`;
}

var root=document.getElementById('root');
function render(){
  queued=false;handlers=[];
  var v=comp.renderVals();
  v.toggleInv=function(){comp.setState({open:!comp.state.open});};
  morphdom(root,'<div id="root">'+T(v)+'</div>');
}
root.addEventListener('click',function(e){var el=e.target.closest('[data-h]');if(el&&!el.disabled){var fn=handlers[+el.dataset.h];if(fn)fn();}});
document.addEventListener('keydown',function(e){
  if(e.key==='Tab'){e.preventDefault();comp.setState({open:!comp.state.open});return;}
  var n=parseInt(e.key,10);if(n>=1&&n<=8)comp.setState({hotSel:n-1});
});
function fit(){var s=Math.min(innerWidth/1280,innerHeight/720);root.style.transform='scale('+s+')';}
addEventListener('resize',fit);fit();
comp=new Component({});
comp.componentDidMount();
render();
</script>
</body>
</html>
